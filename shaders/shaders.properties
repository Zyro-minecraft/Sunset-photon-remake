# Eternal Sunset - Oculus (Forge 1.20.1) / Iris-compatible
oldLighting=false
clouds=off
sun=false
moon=false
shadowTranslucent=true
underwaterOverlay=false
vignette=false
dynamicHandLight=false

# Translucent passes must not blend normals / material ids
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_hand_water.colortex1=off
blend.gbuffers_hand_water.colortex2=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_spidereyes.colortex2=off
blend.gbuffers_beaconbeam.colortex2=off

profile.LOW=SHADOW_RES=1024 GODRAY_SAMPLES=16 !SSAO !ASH_PARTICLES !WAVING_PLANTS
profile.MEDIUM=SHADOW_RES=2048 GODRAY_SAMPLES=24 !SSAO !ASH_PARTICLES WAVING_PLANTS
profile.HIGH=SHADOW_RES=2048 GODRAY_SAMPLES=32 SSAO !ASH_PARTICLES WAVING_PLANTS
profile.ULTRA=SHADOW_RES=4096 GODRAY_SAMPLES=48 SSAO !ASH_PARTICLES WAVING_PLANTS

sliders=SHADOW_RES SHADOW_SOFTNESS SUN_SIZE SUN_ELEVATION FOG_DENSITY GODRAYS_STRENGTH GODRAY_SAMPLES \
        DREAD_STRENGTH VIGNETTE_STRENGTH GRAIN CHROMATIC HEAT_HAZE BLOOM_STRENGTH EXPOSURE MIN_LIGHT \
        ASH_DENSITY AO_STRENGTH WAVE_STRENGTH EMISSIVE_STRENGTH CANOPY_DARKNESS
screen=<profile> FROZEN_SUN [Sun] [World] [Atmosphere] [Dread] [Post] [Quality]
screen.Sun=SUN_SIZE SUN_ELEVATION GODRAYS_STRENGTH HEAT_HAZE
screen.World=WATER_STYLE EMISSIVE_STRENGTH WAVING_PLANTS WAVE_STRENGTH HELD_LIGHT SSAO AO_STRENGTH
screen.Atmosphere=FOG_DENSITY MIN_LIGHT CANOPY_DARKNESS ASH_PARTICLES ASH_DENSITY
screen.Dread=DREAD_STRENGTH VIGNETTE_STRENGTH
screen.Post=EXPOSURE BLOOM_STRENGTH GRAIN CHROMATIC
screen.Quality=SHADOW_RES SHADOW_SOFTNESS GODRAY_SAMPLES
